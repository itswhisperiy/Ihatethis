# fly.toml app configuration file generated for ihatethis on 2026-08-26T03:48:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ihatethis'
primary_region = 'ams'

[build]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']
